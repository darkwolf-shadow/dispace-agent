<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#d94f0e">
  <title>Mangiafuoco</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header>
    <img src="bot-avatar.png" alt="Mangiafuoco" class="avatar">
    <h1>Mangiafuoco</h1>
    <p>Brucia i ricordi, nutri il tuo agente</p>
  </header>

  <main>
    <section class="capture-card">
      <h2>Cattura qualcosa</h2>
      <p>Scatta una foto, registra un audio o scrivi una nota. Mangiafuoco lo invia al tuo agente.</p>

      <div class="preview" id="preview-box">
        <img id="photo-preview" style="display:none;" alt="anteprima">
        <audio id="audio-preview" controls style="display:none;"></audio>
        <video id="video-preview" controls style="display:none;"></video>
        <span id="preview-empty">Nessuna cattura</span>
      </div>

      <div id="recording-indicator" style="display:none;">
        <span class="rec-dot"></span>
        <span id="recording-timer">00:00</span>
        <div class="progress"><div id="recording-progress"></div></div>
      </div>

      <div class="actions">
        <button id="btn-photo">Scatta foto</button>
        <button id="btn-audio">Registra audio</button>
        <button id="btn-speech">Parla (testo)</button>
        <button id="btn-note">Nota testuale</button>
        <button id="btn-clear-preview" class="secondary" style="display:none;">Cancella cattura</button>
      </div>

      <label>Descrivi cosa stai catturando
        <textarea id="caption" rows="2" placeholder="es. riunione con Cida, proposta olio EVO"></textarea>
      </label>

      <label>Tag (separati da virgola)
        <input type="text" id="tags" placeholder="cliente, fiera, appuntamento">
      </label>

      <label class="inline">
        <input type="checkbox" id="send-telegram">
        Invia anche a Steve su Telegram
      </label>
      <small>Richiede una credenziale Telegram salvata in DiSpace.</small>

      <div class="actions">
        <button id="btn-send" disabled>Invia a Mangiafuoco</button>
        <button id="btn-cancel" class="secondary">Annulla</button>
      </div>

      <p id="status" class="status"></p>
    </section>

    <section class="memories-card">
      <h2>Memorie recenti</h2>
      <ul id="memories-list"></ul>
      <button id="btn-refresh" class="secondary">Aggiorna</button>
    </section>
  </main>

  <script src="https://unpkg.com/@capacitor/core@latest/dist/capacitor.js"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
