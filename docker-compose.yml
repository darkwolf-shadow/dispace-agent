version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dispace
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "1000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dispace
      UPLOADS_DIR: /app/data/uploads
      APP_USERNAME: admin
      APP_PASSWORD: admin
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./backend/app:/app/app
      - ./frontend:/app/frontend
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  pgdata:
  uploads:
